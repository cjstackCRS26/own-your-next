 recruiting, does it feel like support or pressure?"},{n:3,t:"spark",p:1,d:"pa",q:"Whose goal is this? Say it in your own words."},{n:4,t:"spark",p:1,d:"ap",q:"What are you most afraid of for me in this whole process?"},{n:5,t:"spark",p:1,d:"ap",q:"What does supporting me look like to you \u2014 and where do you worry you overstep?"},{n:6,t:"mirror",p:1,d:"own",q:"Are you chasing the scholarship, the status, or your child's actual goals?"},{n:7,t:"mirror",p:1,d:"own",q:"When did you last let your athlete make a recruiting decision without stepping in?"},{n:8,t:"mirror",p:1,d:"own",q:"If your child stopped playing tomorrow, what would change between you?"},{n:9,t:"mirror",p:1,d:"own",q:"Are you reliving your own athletic story through your child?"},{n:10,t:"mirror",p:1,d:"own",q:"In recruiting talks, do you spend more time talking or listening?"},{n:11,t:"playbook",p:1,d:"call",q:"Scenario: Your athlete wants to email a coach themselves, but you could write a sharper message. What do you do?"},{n:12,t:"playbook",p:1,d:"call",q:"Scenario: A recruiting task is slipping and your athlete hasn't done it. Do you step in, or let the deadline teach the lesson?"},{n:13,t:"playbook",p:1,d:"call",q:"Scenario: Another parent brags about their kid's offers and you feel the urge to push harder. How do you respond?"},{n:14,t:"playbook",p:1,d:"call",q:"Scenario: Your athlete asks you to stop coming to every practice. What do you say?"},{n:15,t:"playbook",p:1,d:"call",q:"Scenario: You disagree with the club coach's recruiting advice. Do you override it in front of your athlete?"},{n:16,t:"spark",p:2,d:"pa",q:"What level do you honestly believe you can play at?"},{n:17,t:"spark",p:2,d:"pa",q:"What matters most to you \u2014 the school, the level, or the playing time?"},{n:18,t:"spark",p:2,d:"pa",q:"What's one recruiting topic you wish we talked about more?"},{n:19,t:"spark",p:2,d:"ap",q:"Do you honestly think I can play at the level I'm aiming for? Tell me the truth."},{n:20,t:"spark",p:2,d:"ap",q:"Is there something about my recruiting you've been afraid to say to me?"},{n:21,t:"mirror",p:2,d:"own",q:"Do you know your child's honest self-assessment, or only your own opinion of their ability?"},{n:22,t:"mirror",p:2,d:"own",q:"Are you avoiding a hard conversation because you're afraid of the answer?"},{n:23,t:"mirror",p:2,d:"own",q:"Have you confused your child's potential with their current reality?"},{n:24,t:"mirror",p:2,d:"own",q:"When did you last tell your athlete a truth they didn't want to hear?"},{n:25,t:"mirror",p:2,d:"own",q:"Are your expectations built on data, or on hope?"},{n:26,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete is sure they're a Division I prospect; their coach quietly disagrees. How do you bridge that gap?"},{n:27,t:"playbook",p:2,d:"call",q:"Scenario: A recruiter is telling your child exactly what they want to hear. How do you keep them grounded without crushing them?"},{n:28,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete's grades won't clear their dream school's bar. How do you raise it?"},{n:29,t:"playbook",p:2,d:"call",q:"Scenario: You think your child is aiming too low and selling themselves short. How do you push without pressuring?"},{n:30,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete asks, \u201CDo you think I'm good enough?\u201D What do you say?"},{n:31,t:"spark",p:3,d:"pa",q:"Which schools are actually on your list, and why each one?"},{n:32,t:"spark",p:3,d:"pa",q:"What's the next deadline, and what do you need from me to hit it?"},{n:33,t:"spark",p:3,d:"pa",q:"What part of this process feels most confusing to you?"},{n:34,t:"spark",p:3,d:"ap",q:"Which parts of this do you want me to own myself, and which do you want to handle?"},{n:35,t:"spark",p:3,d:"ap",q:"When you talk to coaches or other parents, what do you say about me?"},{n:36,t:"mirror",p:3,d:"own",q:"Are you doing tasks your athlete should be learning to do themselves?"},{n:37,t:"mirror",p:3,d:"own",q:"Do you understand the rules \u2014 eligibility, contact periods, NIL \u2014 or are you guessing?"},{n:38,t:"mirror",p:3,d:"own",q:"Is your home organized for this, or are you both flying blind?"},{n:39,t:"mirror",p:3,d:"own",q:"Are you building your child's independence, or your own indispensability?"},{n:40,t:"mirror",p:3,d:"own",q:"When a coach calls, do you answer for your athlete or hand them the phone?"},{n:41,t:"playbook",p:3,d:"call",q:"Scenario: A college coach calls the house and your athlete is at school. Do you talk recruiting, or take a message?"},{n:42,t:"playbook",p:3,d:"call",q:"Scenario: Your athlete ignored a coach's email for a week. How do you handle it?"},{n:43,t:"playbook",p:3,d:"call",q:"Scenario: You're handed the recruiting questionnaire to fill out. Do you, or do you sit beside them while they do it?"},{n:44,t:"playbook",p:3,d:"call",q:"Scenario: A recruiting service wants $3,000 to \u201Cget your kid seen.\u201D How do you evaluate it?"},{n:45,t:"playbook",p:3,d:"call",q:"Scenario: An eligibility rule you don't understand matters this week. What's your first move?"},{n:46,t:"spark",p:4,d:"pa",q:"What does \u201Caffordable\u201D actually mean to you?"},{n:47,t:"spark",p:4,d:"pa",q:"Bigger scholarship at one school, or better fit at another \u2014 which way do you lean?"},{n:48,t:"spark",p:4,d:"pa",q:"What would you be willing to give up to attend your top school?"},{n:49,t:"spark",p:4,d:"ap",q:"What can our family actually afford \u2014 and what should I stop assuming?"},{n:50,t:"spark",p:4,d:"ap",q:"Would you tell me if a school I love is out of reach financially?"},{n:51,t:"mirror",p:4,d:"own",q:"Have you told your athlete the truth about what your family can afford?"},{n:52,t:"mirror",p:4,d:"own",q:"Are you treating an athletic scholarship as a financial plan when it may not be one?"},{n:53,t:"mirror",p:4,d:"own",q:"Do you know the difference between cost of attendance and your real net cost?"},{n:54,t:"mirror",p:4,d:"own",q:"Are you comfortable saying no to a school you can't afford?"},{n:55,t:"mirror",p:4,d:"own",q:"Are you chasing the biggest scholarship, or the best overall value?"},{n:56,t:"playbook",p:4,d:"call",q:"Scenario: A coach offers a partial scholarship that still leaves a big gap. How do you decide?"},{n:57,t:"playbook",p:4,d:"call",q:"Scenario: Your athlete's dream school is also your most expensive option. How do you start that talk?"},{n:58,t:"playbook",p:4,d:"call",q:"Scenario: A coach hints the money \u201Ccould grow\u201D if your child performs, but nothing's in writing. How do you respond?"},{n:59,t:"playbook",p:4,d:"call",q:"Scenario: Two aid packages look alike until the fine print. What do you compare line by line?"},{n:60,t:"playbook",p:4,d:"call",q:"Scenario: Your athlete wants to commit before you've seen the financial aid offer. What do you say?"},{n:61,t:"spark",p:5,d:"pa",q:"After a bad game, what helps more \u2014 space, or a talk?"},{n:62,t:"spark",p:5,d:"pa",q:"How do you want me to react when a coach says no?"},{n:63,t:"spark",p:5,d:"pa",q:"What's something I say that you actually find encouraging?"},{n:64,t:"spark",p:5,d:"ap",q:"Did you ever feel pushed by your own parents \u2014 and are you doing that to me?"},{n:65,t:"spark",p:5,d:"ap",q:"Will you still be proud of me if I never play in college?"},{n:66,t:"mirror",p:5,d:"own",q:"Is your child playing because they love it, or because they don't want to disappoint you?"},{n:67,t:"mirror",p:5,d:"own",q:"How do you react to bad recruiting news \u2014 and what does that teach your athlete?"},{n:68,t:"mirror",p:5,d:"own",q:"Are you the calm in their process, or another source of stress?"},{n:69,t:"mirror",p:5,d:"own",q:"Can you separate your child's results from your own emotions?"},{n:70,t:"mirror",p:5,d:"own",q:"When recruiting ends, will your relationship be stronger or strained?"},{n:71,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete gets zero offers from their target schools. How do you show up for them?"},{n:72,t:"playbook",p:5,d:"call",q:"Scenario: Your child wants to quit the sport in the middle of recruitment. How do you respond?"},{n:73,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete is crushed after a coach goes silent. What do you say \u2014 and what do you not say?"},{n:74,t:"playbook",p:5,d:"call",q:"Scenario: Signing day comes and it isn't the school you dreamed of for them. How do you show up?"},{n:75,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete commits, then has second thoughts. How do you help them think without deciding for them?"},{n:76,t:"capstone",p:6,d:"both",q:"What does success look like for our family \u2014 signed or not, win or lose?"},{n:77,t:"capstone",p:6,d:"both",q:"What is the one thing we never want recruiting to cost us?"},{n:78,t:"capstone",p:6,d:"both",q:"If the sport ended tomorrow, what would still make all this worth it?"},{n:79,t:"capstone",p:6,d:"both",q:"What's one thing we each want to do differently from here?"},{n:80,t:"capstone",p:6,d:"both",q:"Years from now, what do we want to say about how we handled this together?"},{n:81,t:"capstone",p:6,d:"both",q:"What matters more to us in the end \u2014 where you play, or who you become?"}];var md=[{n:1,t:"spark",p:1,q:"What matters more to you: a specific major, or playing your sport?"},{n:2,t:"spark",p:1,q:"A nationally recognized university, or a smaller school with stronger support in your field?"},{n:3,t:"spark",p:1,q:"What subjects genuinely interest you outside of athletics?"},{n:4,t:"spark",p:1,q:"If athletics ended tomorrow, what would you still want your college experience to give you?"},{n:5,t:"spark",p:1,q:"How important are research, internships, or hands-on learning to you?"},{n:6,t:"mirror",p:1,q:"How confident are you in your career goals right now?"},{n:7,t:"mirror",p:1,q:"Are you picking schools based on reputation, or on real academic fit?"},{n:8,t:"mirror",p:1,q:"What kind of academic environment helps you perform your best?"},{n:9,t:"mirror",p:1,q:"How much support do you need from professors and advisors?"},{n:10,t:"mirror",p:1,q:"What type of learner are you?"},{n:11,t:"playbook",p:1,q:"Scenario: A school has a strong athletic program but limited options in your intended major. What factors decide it?"},{n:12,t:"playbook",p:1,q:"Scenario: A coach says changing majors may be hard due to athletic commitments. How do you respond?"},{n:13,t:"playbook",p:1,q:"Scenario: You love a school's athletics but struggle to see yourself succeeding academically there. What do you do?"},{n:14,t:"playbook",p:1,q:"Scenario: A coach promises they'll make academics work around your sport, but your major's labs conflict with practice. What do you ask before you believe them?"},{n:15,t:"playbook",p:1,q:"Scenario: Your top school offers your major but graduates only 60% of its athletes. How do you find out if you'd actually finish your degree there?"},{n:16,t:"spark",p:2,q:"Start immediately at a lower level, or develop for two years at a higher one?"},{n:17,t:"spark",p:2,q:"What does a successful college athletic career look like to you?"},{n:18,t:"spark",p:2,q:"Is competing at the highest level more important than playing time?"},{n:19,t:"spark",p:2,q:"How important is being part of a winning program?"},{n:20,t:"spark",p:2,q:"What type of coaching style helps you thrive?"},{n:21,t:"mirror",p:2,q:"What role do you realistically expect in your first college season?"},{n:22,t:"mirror",p:2,q:"How important is immediate playing time to you?"},{n:23,t:"mirror",p:2,q:"Are you chasing a level because it fits you, or because it sounds impressive?"},{n:24,t:"mirror",p:2,q:"What sacrifices are you willing to make to compete?"},{n:25,t:"mirror",p:2,q:"How would you handle not playing as much as you expected?"},{n:26,t:"playbook",p:2,q:"Scenario: You can start at a Division III program or sit behind upperclassmen at a Division I. What matters most?"},{n:27,t:"playbook",p:2,q:"Scenario: A coach is honest that you'll need time to develop. Does that honesty raise or lower your interest?"},{n:28,t:"playbook",p:2,q:"Scenario: Two schools offer similar opportunities, but one has a coaching style you don't love. What do you do?"},{n:29,t:"playbook",p:2,q:"Scenario: A coach calls you a project who could be special by junior year. Do you want to be a project, and what do you ask to test if they'll really develop you?"},{n:30,t:"playbook",p:2,q:"Scenario: A powerhouse where you'd likely never start, or a key role one level down? Name the three questions that decide it."},{n:31,t:"spark",p:3,q:"A large university, or a small college? Pick one."},{n:32,t:"spark",p:3,q:"City, suburban, or rural campus?"},{n:33,t:"spark",p:3,q:"How important are campus traditions and school spirit to you?"},{n:34,t:"spark",p:3,q:"What does your ideal college day look like?"},{n:35,t:"spark",p:3,q:"What kind of social environment energizes you?"},{n:36,t:"mirror",p:3,q:"How comfortable are you stepping outside your comfort zone?"},{n:37,t:"mirror",p:3,q:"How much independence do you want from your family?"},{n:38,t:"mirror",p:3,q:"What campus size actually feels right for you?"},{n:39,t:"mirror",p:3,q:"What would make a campus feel like home?"},{n:40,t:"mirror",p:3,q:"What non-athletic experiences do you hope to have in college?"},{n:41,t:"playbook",p:3,q:"Scenario: One campus has amazing facilities but doesn't feel like home; another feels welcoming but has fewer resources. How do you weigh them?"},{n:42,t:"playbook",p:3,q:"Scenario: On a visit you click with the players but not the campus. How much should that count?"},{n:43,t:"playbook",p:3,q:"Scenario: You love the campus but don't connect with the team culture. What do you do?"},{n:44,t:"playbook",p:3,q:"Scenario: You visit on a sunny game-day weekend and love it. How do you find out what a normal rainy Tuesday feels like there?"},{n:45,t:"playbook",p:3,q:"Scenario: The campus is three flights from home and you've never lived far away. How do you test whether the distance is exciting or a dealbreaker?"},{n:46,t:"spark",p:4,q:"How important is graduating with minimal debt?"},{n:47,t:"spark",p:4,q:"Have you talked openly with your family about college finances?"},{n:48,t:"spark",p:4,q:"What sacrifices would you make to attend your dream school?"},{n:49,t:"spark",p:4,q:"How much does scholarship amount influence your decision?"},{n:50,t:"spark",p:4,q:"What does affordable actually mean to you?"},{n:51,t:"mirror",p:4,q:"Do you understand the full cost of college beyond tuition?"},{n:52,t:"mirror",p:4,q:"How comfortable are you discussing money?"},{n:53,t:"mirror",p:4,q:"Are you weighing long-term financial outcomes when comparing schools?"},{n:54,t:"mirror",p:4,q:"How important is financial flexibility after graduation?"},{n:55,t:"mirror",p:4,q:"Are you chasing the biggest scholarship, or the best overall value?"},{n:56,t:"playbook",p:4,q:"Scenario: One school offers more athletic aid but a higher total cost; another offers less aid but a lower net cost. How do you compare them?"},{n:57,t:"playbook",p:4,q:"Scenario: A school is your perfect fit but requires some student loans. How do you evaluate that?"},{n:58,t:"playbook",p:4,q:"Scenario: Your family prefers one school for cost; you prefer another for fit. How do you navigate that talk?"},{n:59,t:"playbook",p:4,q:"Scenario: A coach offers 25% now but hints it could grow if you perform. How do you evaluate a promise that isn't in writing?"},{n:60,t:"playbook",p:4,q:"Scenario: Two aid offers look alike until you read the fine print on renewal terms and fees. What do you compare line by line?"},{n:61,t:"spark",p:5,q:"What qualities do you value most in teammates?"},{n:62,t:"spark",p:5,q:"What kind of coach brings out your best?"},{n:63,t:"spark",p:5,q:"How important is team culture to your experience?"},{n:64,t:"spark",p:5,q:"What does accountability mean to you?"},{n:65,t:"spark",p:5,q:"What team values matter most to you?"},{n:66,t:"mirror",p:5,q:"What type of teammate are you?"},{n:67,t:"mirror",p:5,q:"How do you handle competition within your own team?"},{n:68,t:"mirror",p:5,q:"What kind of culture helps you thrive?"},{n:69,t:"mirror",p:5,q:"What would be a dealbreaker in a team environment?"},{n:70,t:"mirror",p:5,q:"How important is feeling connected to your teammates?"},{n:71,t:"playbook",p:5,q:"Scenario: You love the coach and facilities, but players describe the culture as toxic. What do you do?"},{n:72,t:"playbook",p:5,q:"Scenario: The team wins often, but the players seem unhappy. How much would that matter to you?"},{n:73,t:"playbook",p:5,q:"Scenario: You connect with the team but have concerns about the coaching staff. How do you evaluate it?"},{n:74,t:"playbook",p:5,q:"Scenario: On your visit the seniors seem checked out and the freshmen do all the talking. What does that tell you, and what do you ask players privately?"},{n:75,t:"playbook",p:5,q:"Scenario: A coach runs an intense, old-school program some athletes love and others quietly resent. How do you figure out which type you'd be?"},{n:76,t:"capstone",p:6,q:"What are your top five non-negotiables in a college experience?"},{n:77,t:"capstone",p:6,q:"What does your ideal college fit actually look like?"},{n:78,t:"capstone",p:6,q:"What are you unwilling to compromise on?"},{n:79,t:"capstone",p:6,q:"Imagine graduation day. What would make you say, I chose the right school?"},{n:80,t:"capstone",p:6,q:"If you had to decide today, what would matter most?"},{n:81,t:"capstone",p:6,q:"If your sport ended tomorrow, would you still choose that school?"}];var Qt=[{n:1,step:1,lvl:1,title:"Say it out loud",body:"Tell your family and your coach, in your own words, what you want from your sport after high school. Then put it in writing: what you want, why, and who is on your team.",win:"Your intent written, signed and shared with your coach.",own:"O",habit:null},{n:2,step:1,lvl:1,title:"Find your starting line",body:"Take an honest look at where you stand today: your grades, your game, your habits and your recruiting work. Rate each from 1 to 5.",win:"Your starting line, and the two areas you most want to grow.",own:"O",habit:null},{n:3,step:1,lvl:1,title:"Name your team",body:"List the adults on your team: a parent, your coach, your counselor and one more. Tell each one how they can help, and what you will handle yourself.",win:"Four names, and each one knows their role.",own:"N",habit:null},{n:4,step:1,lvl:1,title:"One place for everything",body:"Set up one place to keep your recruiting work: a notebook, a folder or a tracker. Pick a 10-minute time each week to update it, and put it on your calendar.",win:"One place for everything, and a weekly check-in on your calendar.",own:"W",habit:"Be Informed & Organized"},{n:5,step:2,lvl:1,title:"Learn every level",body:"Learn the difference between NCAA DI, DII and DIII, NAIA and junior college: how many schools, how aid works, and what a week looks like.",win:"You can explain all five levels to a teammate.",own:"W",habit:null},{n:6,step:2,lvl:1,title:"Get the real odds",body:"Look up how many high school athletes in your sport play in college at each level. Write down where most of the roster spots are.",win:"Your sport's odds written down, by level.",own:"O",habit:null},{n:7,step:2,lvl:1,title:"Know the rules and the calendar",body:"Find your sport's contact dates: when coaches can email, call and invite you to visit, at each level. Put the key dates on your calendar, then create your free NCAA Eligibility Center Profile Page.",win:"Your sport's key dates on your calendar, and your free profile page created.",own:"W",habit:null},{n:8,step:2,lvl:1,title:"Myth or fact?",body:"Write down three things you have heard about recruiting. Check each one with a coach, a counselor or the NCAA website. Pick the one you believed most and write what you will do differently.",win:"One myth crossed out, and a new plan in its place.",own:"O",habit:"Be Realistic & Resilient"},{n:9,step:3,lvl:2,title:"Find your strengths",body:"Write down what you are good at, on and off the field. Then ask your career advisor and one other adult what they see as your strengths, and compare their answers with yours.",win:"Three strengths you own, two areas to grow, and one strength someone else named.",own:"O",habit:null},{n:10,step:3,lvl:2,title:"Write your why and stack your goals",body:"Answer \u201CWhat drives you to compete?\u201D in one or two sentences. Then build your goal pyramid: one big goal, the milestones under it, and the weekly habits that move you.",win:"Your why written and a goal pyramid built.",own:"O",habit:null},{n:11,step:3,lvl:2,title:"Write who you are",body:"Write your identity statement: who you are, what you bring to a team, and the opportunity you want most. Read it to someone who knows you well.",win:"Your identity statement written, and one person heard it.",own:"N",habit:null},{n:12,step:3,lvl:2,title:"More than your sport",body:"List three things you care about that have nothing to do with your sport. Give one of them an hour this week.",win:"One hour spent on something just for you.",own:"O",habit:"Prioritize Health & Wellness"},{n:13,step:4,lvl:2,title:"Check your habits",body:"Rate your habits from 1 to 5 in four areas: yourself, your academics, your sport and your recruiting work. Compare with your starting line from Week 2.",win:"Your habits rated, and the one that slipped most.",own:"O",habit:null},{n:14,step:4,lvl:2,title:"Four commitments, four habits",body:"Choose one daily habit for each commitment: to yourself, your academics, your sport and your recruiting work.",win:"Four habits written where you will see them every day.",own:"W",habit:null},{n:15,step:4,lvl:2,title:"Show someone your plan",body:"Walk a coach or counselor through your four habits. Ask what they would change, and change one thing.",win:"Your plan reviewed, and one change made.",own:"N",habit:null},{n:16,step:4,lvl:2,title:"Block your week",body:"Put each habit on your weekly schedule around school, practice and games. Check them off every day for the next four weeks.",win:"Your habits are blocked into your week and day one is checked.",own:"W",habit:"Be Informed & Organized"},{n:17,step:5,lvl:3,title:"Find the core course list",body:"Find your school's approved core courses for the NCAA, and the NAIA if you need it. Mark the ones you have already taken.",win:"Your core courses marked, so you know what is left.",own:"W",habit:null},{n:18,step:5,lvl:3,title:"Know your core GPA",body:"Sit down with your counselor and work out your core-course GPA. Compare it with each level's rules.",win:"Your core GPA, and where it stands at each level.",own:"N",habit:null},{n:19,step:5,lvl:3,title:"Plan all four years",body:"Lay out your courses through senior year so every core requirement is covered. Then write one academic goal for this semester.",win:"A four-year plan on file and a semester goal written.",own:"O",habit:null},{n:20,step:5,lvl:3,title:"Protect your sleep",body:"For one week, just notice when you get to bed on school nights. Choose one change that gives you more sleep, and try it for five nights.",win:"One change to your evening routine, tried for five nights.",own:"O",habit:"Prioritize Health & Wellness"},{n:21,step:6,lvl:3,title:"Score three colleges",body:"Pick three colleges and rate each from 1 to 5 on four lenses: academic, athletic, financial and personal.",win:"Three colleges rated on every lens.",own:"O",habit:null},{n:22,step:6,lvl:3,title:"Ask for the honest read",body:"Show your coach your list and ask where your level really fits. Listen without arguing, and write down what they say.",win:"Your coach's honest read, written down.",own:"N",habit:null},{n:23,step:6,lvl:3,title:"Build your first list",body:"Build a list of five or more schools across at least two levels. Run each school's net price calculator.",win:"A first target list across two levels, with a net price for each school.",own:"W",habit:null},{n:24,step:6,lvl:3,title:"One list, one place",body:"Put every school on your list in one place, with its website, questionnaire link and any deadlines.",win:"Your whole list in one place.",own:"W",habit:"Be Informed & Organized"},{n:25,step:7,lvl:4,title:"See yourself as a coach does",body:"Pick eight skills college coaches look at in your sport, including mental toughness and attitude. Rate yourself on each: Developing, Solid, Strong or Standout.",win:"Eight skills rated, honestly.",own:"O",habit:null},{n:26,step:7,lvl:4,title:"Get your coach's rating",body:"Ask your high school or club coach to rate you on the same eight skills. Talk through the biggest gap together.",win:"Both ratings compared, and the biggest gap talked through.",own:"N",habit:null},{n:27,step:7,lvl:4,title:"A goal in every area",body:"Set one development goal each for academics, athletics, physical and fit. If you will play NCAA or NAIA, register with the Eligibility Center.",win:"Four development goals, and registration done if you need it.",own:"W",habit:null},{n:28,step:7,lvl:4,title:"Take the feedback",body:"Pick the hardest thing your coach told you. Write one sentence on what is true about it, and one thing you will do about it this week.",win:"Feedback turned into one action.",own:"O",habit:"Be Realistic & Resilient"},{n:29,step:8,lvl:4,title:"Who you are, in three words",body:"Write who you are and what you value most. Choose the three words you want coaches to remember you by.",win:"Three words and your top values written down.",own:"O",habit:null},{n:30,step:8,lvl:4,title:"Make your profiles match",body:"Update your recruiting profiles so the photo, bio and numbers match everywhere. Draft your intro letter in your own words.",win:"Matching profiles and an intro letter draft.",own:"W",habit:null},{n:31,step:8,lvl:4,title:"Plan your video with your coach",body:"Plan your highlight video with your coach: which clips, in what order, and how long. Then check your social media: would you be glad for a coach to see every post?",win:"A video plan your coach approves, and social media you would be proud to show.",own:"N",habit:null},{n:32,step:8,lvl:4,title:"Pitch more, scroll less",body:"Practice your 30-second pitch out loud three times this week. Take one evening off social media and notice how it feels.",win:"Three pitch practices, and one evening offline.",own:"O",habit:"Prioritize Health & Wellness"},{n:33,step:9,lvl:5,title:"Fill out the questionnaires",body:"Complete the recruiting questionnaire on the athletics website of each school on your list.",win:"A questionnaire done for every school on your list.",own:"W",habit:null},{n:34,step:9,lvl:5,title:"Email three coaches",body:"Write three emails to coaches, each one written for that program. Send them yourself, from your own email, and note the date you sent each one.",win:"Three personal emails sent.",own:"O",habit:null},{n:35,step:9,lvl:5,title:"Practice the call",body:"Practice a coach phone call with your counselor or coach: introduce yourself, ask two questions and say thank you.",win:"One practice call done, with your questions ready.",own:"N",habit:null},{n:36,step:9,lvl:5,title:"No reply is not a no",body:"Pick a coach who has not replied. Send a short follow-up with something new: your schedule, a grade or a new clip.",win:"One follow-up sent.",own:"O",habit:"Be Realistic & Resilient"},{n:37,step:10,lvl:5,title:"Pick events that fit",body:"Before you pay for a camp or showcase, find out which colleges will be there. Go only if schools on your list will be.",win:"One event chosen because your schools will be there.",own:"O",habit:null},{n:38,step:10,lvl:5,title:"Tell coaches you're coming",body:"Email every coach on your list who will be there: your schedule, jersey number and position. Ask your coach to reach out too.",win:"Every listed coach emailed before the event.",own:"N",habit:null},{n:39,step:10,lvl:5,title:"Follow up within 48 hours",body:"After the event, thank every coach who saw you, within two days. Note where each school stands with you now.",win:"Every follow-up sent, and your list updated.",own:"W",habit:null},{n:40,step:10,lvl:5,title:"Recover like it counts",body:"Plan rest, food and sleep around your next event or travel weekend. Pack the night before.",win:"A recovery plan ready for your next event.",own:"O",habit:"Prioritize Health & Wellness"},{n:41,step:11,lvl:5,title:"Prepare your questions",body:"Research the program and write five questions for the coach, the players and an advisor. Confirm the visit with the coach by email.",win:"Five questions written and the visit confirmed.",own:"W",habit:null},{n:42,step:11,lvl:5,title:"Live a normal day",body:"On your visit, attend a class, a practice and a meal if you can. Picture yourself there on an ordinary Tuesday in February.",win:"You can describe a normal day there.",own:"O",habit:null},{n:43,step:11,lvl:5,title:"Score it, then say thanks",body:"Rate the visit on the four lenses the same day. Email the coach a thank-you within two days.",win:"The visit rated and a thank-you sent.",own:"W",habit:null},{n:44,step:11,lvl:5,title:"Compare visits fairly",body:"Line up every visit you have rated, side by side. Note what surprised you about each one.",win:"All your visits side by side in one place.",own:"W",habit:"Be Informed & Organized"},{n:45,step:12,lvl:6,title:"File the FAFSA",body:"Sit down with your family and complete the FAFSA, and the CSS Profile if a school asks for it.",win:"FAFSA submitted.",own:"N",habit:null},{n:46,step:12,lvl:6,title:"Compare the real cost",body:"Line up every offer and compare the net cost over four years, not the size of the scholarship.",win:"The four-year net cost of every offer, side by side.",own:"O",habit:null},{n:47,step:12,lvl:6,title:"Decide by your why",body:"Rank your top five factors, rate each school, and reread the why you wrote in Week 10. Decide, then thank every coach who recruited you.",win:"Your choice made, and every other coach thanked.",own:"O",habit:null},{n:48,step:12,lvl:6,title:"No decision under pressure",body:"If a coach sets a deadline, ask for the offer in writing and for time to decide. Talk with your family and counselor before you answer.",win:"Every offer in writing, and no answer given under pressure.",own:"N",habit:"Be Realistic & Resilient"},{n:49,step:13,lvl:7,title:"Send the final paperwork",body:"Ask your counselor to send your final transcript and proof of graduation to your college and the Eligibility Center.",win:"Final transcript and proof of graduation requested.",own:"W",habit:null},{n:50,step:13,lvl:7,title:"Confirm the details",body:"Confirm your eligibility, aid and housing with each office. Ask your new coach for the summer training plan.",win:"Eligibility, aid and housing confirmed, and your summer plan in hand.",own:"N",habit:null},{n:51,step:13,lvl:7,title:"Look back",body:"Write your exit reflection: what this journey taught you, who helped, and the advice you would give a freshman.",win:"Your exit reflection written.",own:"O",habit:null},{n:52,step:13,lvl:7,title:"Build your support on campus",body:"Find three people you can go to in your first semester: an academic advisor, a teammate and someone outside your sport.",win:"Three names for your first-year support team.",own:"N",habit:"Prioritize Health & Wellness"}];var zn="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKUAAAC2CAYAAAC4aU3vAABM4klEQVR42u29d5wdZ3U3/j3PtDtz2xatepesZsmy5S4XGdu40EwnhBJqEpJfeAMkkOTN7yUkbyAEiAmBhIRQDAYHjAEbjI273KtkVatLq7bS7mrb7XdmnvP+8czMvbt7d7W7Wkm7q53PZ1Xu3jbPfOd7zvme85xDGN8HVX7WkXpovQQgT/bCpqYViazMpIRmNJKU9RCiEVI2gVDHTI0gbiBQEuAkgxIEdpjJAdgkwARBMCM24BcjFMGQDJRB5BI4x6A8ATkAPQzOgKmTiE+A0QkS7WDZzkJ0St89kRDJnra27dkhrIEA1ong3BlA9c+4vajj6bsKBb71CIA3EPhEYsaSBva9GcxypmDMZaK5YJ5FoFkgTAF4CoNSBI4DZIAIVHM5uP/V5X7/GHhpqdajVPtTmAGwy6AcgXsAOgFGGwNHQXyEGAclaQeJ+Ahpeku2ZVfHYGsQrFcIVjlegErjAIAMwK/5rBkznKQbm+2DFhGwBEIuJYnFTDQH4JkEShGJ3mfJVUDjfgiTQ1ijkawZn+T/IYgqSKYqAPf5/swSrEDbQuBDDNoDpp0C2AWWezNm6RBaWvIDfBetal3HJFDHCihFxQTXNr9O07zpAtpiAKuY5SoQrSBgEYDpRELvzzrRtZcAy6rTparzpjF4c3Kf
