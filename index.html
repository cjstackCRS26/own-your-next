 recruiting, does it feel like support or pressure?"},{n:3,t:"spark",p:1,d:"pa",q:"Whose goal is this? Say it in your own words."},{n:4,t:"spark",p:1,d:"ap",q:"What are you most afraid of for me in this whole process?"},{n:5,t:"spark",p:1,d:"ap",q:"What does supporting me look like to you \u2014 and where do you worry you overstep?"},{n:6,t:"mirror",p:1,d:"own",q:"Are you chasing the scholarship, the status, or your child's actual goals?"},{n:7,t:"mirror",p:1,d:"own",q:"When did you last let your athlete make a recruiting decision without stepping in?"},{n:8,t:"mirror",p:1,d:"own",q:"If your child stopped playing tomorrow, what would change between you?"},{n:9,t:"mirror",p:1,d:"own",q:"Are you reliving your own athletic story through your child?"},{n:10,t:"mirror",p:1,d:"own",q:"In recruiting talks, do you spend more time talking or listening?"},{n:11,t:"playbook",p:1,d:"call",q:"Scenario: Your athlete wants to email a coach themselves, but you could write a sharper message. What do you do?"},{n:12,t:"playbook",p:1,d:"call",q:"Scenario: A recruiting task is slipping and your athlete hasn't done it. Do you step in, or let the deadline teach the lesson?"},{n:13,t:"playbook",p:1,d:"call",q:"Scenario: Another parent brags about their kid's offers and you feel the urge to push harder. How do you respond?"},{n:14,t:"playbook",p:1,d:"call",q:"Scenario: Your athlete asks you to stop coming to every practice. What do you say?"},{n:15,t:"playbook",p:1,d:"call",q:"Scenario: You disagree with the club coach's recruiting advice. Do you override it in front of your athlete?"},{n:16,t:"spark",p:2,d:"pa",q:"What level do you honestly believe you can play at?"},{n:17,t:"spark",p:2,d:"pa",q:"What matters most to you \u2014 the school, the level, or the playing time?"},{n:18,t:"spark",p:2,d:"pa",q:"What's one recruiting topic you wish we talked about more?"},{n:19,t:"spark",p:2,d:"ap",q:"Do you honestly think I can play at the level I'm aiming for? Tell me the truth."},{n:20,t:"spark",p:2,d:"ap",q:"Is there something about my recruiting you've been afraid to say to me?"},{n:21,t:"mirror",p:2,d:"own",q:"Do you know your child's honest self-assessment, or only your own opinion of their ability?"},{n:22,t:"mirror",p:2,d:"own",q:"Are you avoiding a hard conversation because you're afraid of the answer?"},{n:23,t:"mirror",p:2,d:"own",q:"Have you confused your child's potential with their current reality?"},{n:24,t:"mirror",p:2,d:"own",q:"When did you last tell your athlete a truth they didn't want to hear?"},{n:25,t:"mirror",p:2,d:"own",q:"Are your expectations built on data, or on hope?"},{n:26,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete is sure they're a Division I prospect; their coach quietly disagrees. How do you bridge that gap?"},{n:27,t:"playbook",p:2,d:"call",q:"Scenario: A recruiter is telling your child exactly what they want to hear. How do you keep them grounded without crushing them?"},{n:28,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete's grades won't clear their dream school's bar. How do you raise it?"},{n:29,t:"playbook",p:2,d:"call",q:"Scenario: You think your child is aiming too low and selling themselves short. How do you push without pressuring?"},{n:30,t:"playbook",p:2,d:"call",q:"Scenario: Your athlete asks, \u201CDo you think I'm good enough?\u201D What do you say?"},{n:31,t:"spark",p:3,d:"pa",q:"Which schools are actually on your list, and why each one?"},{n:32,t:"spark",p:3,d:"pa",q:"What's the next deadline, and what do you need from me to hit it?"},{n:33,t:"spark",p:3,d:"pa",q:"What part of this process feels most confusing to you?"},{n:34,t:"spark",p:3,d:"ap",q:"Which parts of this do you want me to own myself, and which do you want to handle?"},{n:35,t:"spark",p:3,d:"ap",q:"When you talk to coaches or other parents, what do you say about me?"},{n:36,t:"mirror",p:3,d:"own",q:"Are you doing tasks your athlete should be learning to do themselves?"},{n:37,t:"mirror",p:3,d:"own",q:"Do you understand the rules \u2014 eligibility, contact periods, NIL \u2014 or are you guessing?"},{n:38,t:"mirror",p:3,d:"own",q:"Is your home organized for this, or are you both flying blind?"},{n:39,t:"mirror",p:3,d:"own",q:"Are you building your child's independence, or your own indispensability?"},{n:40,t:"mirror",p:3,d:"own",q:"When a coach calls, do you answer for your athlete or hand them the phone?"},{n:41,t:"playbook",p:3,d:"call",q:"Scenario: A college coach calls the house and your athlete is at school. Do you talk recruiting, or take a message?"},{n:42,t:"playbook",p:3,d:"call",q:"Scenario: Your athlete ignored a coach's email for a week. How do you handle it?"},{n:43,t:"playbook",p:3,d:"call",q:"Scenario: You're handed the recruiting questionnaire to fill out. Do you, or do you sit beside them while they do it?"},{n:44,t:"playbook",p:3,d:"call",q:"Scenario: A recruiting service wants $3,000 to \u201Cget your kid seen.\u201D How do you evaluate it?"},{n:45,t:"playbook",p:3,d:"call",q:"Scenario: An eligibility rule you don't understand matters this week. What's your first move?"},{n:46,t:"spark",p:4,d:"pa",q:"What does \u201Caffordable\u201D actually mean to you?"},{n:47,t:"spark",p:4,d:"pa",q:"Bigger scholarship at one school, or better fit at another \u2014 which way do you lean?"},{n:48,t:"spark",p:4,d:"pa",q:"What would you be willing to give up to attend your top school?"},{n:49,t:"spark",p:4,d:"ap",q:"What can our family actually afford \u2014 and what should I stop assuming?"},{n:50,t:"spark",p:4,d:"ap",q:"Would you tell me if a school I love is out of reach financially?"},{n:51,t:"mirror",p:4,d:"own",q:"Have you told your athlete the truth about what your family can afford?"},{n:52,t:"mirror",p:4,d:"own",q:"Are you treating an athletic scholarship as a financial plan when it may not be one?"},{n:53,t:"mirror",p:4,d:"own",q:"Do you know the difference between cost of attendance and your real net cost?"},{n:54,t:"mirror",p:4,d:"own",q:"Are you comfortable saying no to a school you can't afford?"},{n:55,t:"mirror",p:4,d:"own",q:"Are you chasing the biggest scholarship, or the best overall value?"},{n:56,t:"playbook",p:4,d:"call",q:"Scenario: A coach offers a partial scholarship that still leaves a big gap. How do you decide?"},{n:57,t:"playbook",p:4,d:"call",q:"Scenario: Your athlete's dream school is also your most expensive option. How do you start that talk?"},{n:58,t:"playbook",p:4,d:"call",q:"Scenario: A coach hints the money \u201Ccould grow\u201D if your child performs, but nothing's in writing. How do you respond?"},{n:59,t:"playbook",p:4,d:"call",q:"Scenario: Two aid packages look alike until the fine print. What do you compare line by line?"},{n:60,t:"playbook",p:4,d:"call",q:"Scenario: Your athlete wants to commit before you've seen the financial aid offer. What do you say?"},{n:61,t:"spark",p:5,d:"pa",q:"After a bad game, what helps more \u2014 space, or a talk?"},{n:62,t:"spark",p:5,d:"pa",q:"How do you want me to react when a coach says no?"},{n:63,t:"spark",p:5,d:"pa",q:"What's something I say that you actually find encouraging?"},{n:64,t:"spark",p:5,d:"ap",q:"Did you ever feel pushed by your own parents \u2014 and are you doing that to me?"},{n:65,t:"spark",p:5,d:"ap",q:"Will you still be proud of me if I never play in college?"},{n:66,t:"mirror",p:5,d:"own",q:"Is your child playing because they love it, or because they don't want to disappoint you?"},{n:67,t:"mirror",p:5,d:"own",q:"How do you react to bad recruiting news \u2014 and what does that teach your athlete?"},{n:68,t:"mirror",p:5,d:"own",q:"Are you the calm in their process, or another source of stress?"},{n:69,t:"mirror",p:5,d:"own",q:"Can you separate your child's results from your own emotions?"},{n:70,t:"mirror",p:5,d:"own",q:"When recruiting ends, will your relationship be stronger or strained?"},{n:71,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete gets zero offers from their target schools. How do you show up for them?"},{n:72,t:"playbook",p:5,d:"call",q:"Scenario: Your child wants to quit the sport in the middle of recruitment. How do you respond?"},{n:73,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete is crushed after a coach goes silent. What do you say \u2014 and what do you not say?"},{n:74,t:"playbook",p:5,d:"call",q:"Scenario: Signing day comes and it isn't the school you dreamed of for them. How do you show up?"},{n:75,t:"playbook",p:5,d:"call",q:"Scenario: Your athlete commits, then has second thoughts. How do you help them think without deciding for them?"},{n:76,t:"capstone",p:6,d:"both",q:"What does success look like for our family \u2014 signed or not, win or lose?"},{n:77,t:"capstone",p:6,d:"both",q:"What is the one thing we never want recruiting to cost us?"},{n:78,t:"capstone",p:6,d:"both",q:"If the sport ended tomorrow, what would still make all this worth it?"},{n:79,t:"capstone",p:6,d:"both",q:"What's one thing we each want to do differently from here?"},{n:80,t:"capstone",p:6,d:"both",q:"Years from now, what do we want to say about how we handled this together?"},{n:81,t:"capstone",p:6,d:"both",q:"What matters more to us in the end \u2014 where you play, or who you become?"}];var gd=[{n:1,t:"spark",p:1,q:"What matters more to you: a specific major, or playing your sport?"},{n:2,t:"spark",p:1,q:"A nationally recognized university, or a smaller school with stronger support in your field?"},{n:3,t:"spark",p:1,q:"What subjects genuinely interest you outside of athletics?"},{n:4,t:"spark",p:1,q:"If athletics ended tomorrow, what would you still want your college experience to give you?"},{n:5,t:"spark",p:1,q:"How important are research, internships, or hands-on learning to you?"},{n:6,t:"mirror",p:1,q:"How confident are you in your career goals right now?"},{n:7,t:"mirror",p:1,q:"Are you picking schools based on reputation, or on real academic fit?"},{n:8,t:"mirror",p:1,q:"What kind of academic environment helps you perform your best?"},{n:9,t:"mirror",p:1,q:"How much support do you need from professors and advisors?"},{n:10,t:"mirror",p:1,q:"What type of learner are you?"},{n:11,t:"playbook",p:1,q:"Scenario: A school has a strong athletic program but limited options in your intended major. What factors decide it?"},{n:12,t:"playbook",p:1,q:"Scenario: A coach says changing majors may be hard due to athletic commitments. How do you respond?"},{n:13,t:"playbook",p:1,q:"Scenario: You love a school's athletics but struggle to see yourself succeeding academically there. What do you do?"},{n:14,t:"playbook",p:1,q:"Scenario: A coach promises they'll make academics work around your sport, but your major's labs conflict with practice. What do you ask before you believe them?"},{n:15,t:"playbook",p:1,q:"Scenario: Your top school offers your major but graduates only 60% of its athletes. How do you find out if you'd actually finish your degree there?"},{n:16,t:"spark",p:2,q:"Start immediately at a lower level, or develop for two years at a higher one?"},{n:17,t:"spark",p:2,q:"What does a successful college athletic career look like to you?"},{n:18,t:"spark",p:2,q:"Is competing at the highest level more important than playing time?"},{n:19,t:"spark",p:2,q:"How important is being part of a winning program?"},{n:20,t:"spark",p:2,q:"What type of coaching style helps you thrive?"},{n:21,t:"mirror",p:2,q:"What role do you realistically expect in your first college season?"},{n:22,t:"mirror",p:2,q:"How important is immediate playing time to you?"},{n:23,t:"mirror",p:2,q:"Are you chasing a level because it fits you, or because it sounds impressive?"},{n:24,t:"mirror",p:2,q:"What sacrifices are you willing to make to compete?"},{n:25,t:"mirror",p:2,q:"How would you handle not playing as much as you expected?"},{n:26,t:"playbook",p:2,q:"Scenario: You can start at a Division III program or sit behind upperclassmen at a Division I. What matters most?"},{n:27,t:"playbook",p:2,q:"Scenario: A coach is honest that you'll need time to develop. Does that honesty raise or lower your interest?"},{n:28,t:"playbook",p:2,q:"Scenario: Two schools offer similar opportunities, but one has a coaching style you don't love. What do you do?"},{n:29,t:"playbook",p:2,q:"Scenario: A coach calls you a project who could be special by junior year. Do you want to be a project, and what do you ask to test if they'll really develop you?"},{n:30,t:"playbook",p:2,q:"Scenario: A powerhouse where you'd likely never start, or a key role one level down? Name the three questions that decide it."},{n:31,t:"spark",p:3,q:"A large university, or a small college? Pick one."},{n:32,t:"spark",p:3,q:"City, suburban, or rural campus?"},{n:33,t:"spark",p:3,q:"How important are campus traditions and school spirit to you?"},{n:34,t:"spark",p:3,q:"What does your ideal college day look like?"},{n:35,t:"spark",p:3,q:"What kind of social environment energizes you?"},{n:36,t:"mirror",p:3,q:"How comfortable are you stepping outside your comfort zone?"},{n:37,t:"mirror",p:3,q:"How much independence do you want from your family?"},{n:38,t:"mirror",p:3,q:"What campus size actually feels right for you?"},{n:39,t:"mirror",p:3,q:"What would make a campus feel like home?"},{n:40,t:"mirror",p:3,q:"What non-athletic experiences do you hope to have in college?"},{n:41,t:"playbook",p:3,q:"Scenario: One campus has amazing facilities but doesn't feel like home; another feels welcoming but has fewer resources. How do you weigh them?"},{n:42,t:"playbook",p:3,q:"Scenario: On a visit you click with the players but not the campus. How much should that count?"},{n:43,t:"playbook",p:3,q:"Scenario: You love the campus but don't connect with the team culture. What do you do?"},{n:44,t:"playbook",p:3,q:"Scenario: You visit on a sunny game-day weekend and love it. How do you find out what a normal rainy Tuesday feels like there?"},{n:45,t:"playbook",p:3,q:"Scenario: The campus is three flights from home and you've never lived far away. How do you test whether the distance is exciting or a dealbreaker?"},{n:46,t:"spark",p:4,q:"How important is graduating with minimal debt?"},{n:47,t:"spark",p:4,q:"Have you talked openly with your family about college finances?"},{n:48,t:"spark",p:4,q:"What sacrifices would you make to attend your dream school?"},{n:49,t:"spark",p:4,q:"How much does scholarship amount influence your decision?"},{n:50,t:"spark",p:4,q:"What does affordable actually mean to you?"},{n:51,t:"mirror",p:4,q:"Do you understand the full cost of college beyond tuition?"},{n:52,t:"mirror",p:4,q:"How comfortable are you discussing money?"},{n:53,t:"mirror",p:4,q:"Are you weighing long-term financial outcomes when comparing schools?"},{n:54,t:"mirror",p:4,q:"How important is financial flexibility after graduation?"},{n:55,t:"mirror",p:4,q:"Are you chasing the biggest scholarship, or the best overall value?"},{n:56,t:"playbook",p:4,q:"Scenario: One school offers more athletic aid but a higher total cost; another offers less aid but a lower net cost. How do you compare them?"},{n:57,t:"playbook",p:4,q:"Scenario: A school is your perfect fit but requires some student loans. How do you evaluate that?"},{n:58,t:"playbook",p:4,q:"Scenario: Your family prefers one school for cost; you prefer another for fit. How do you navigate that talk?"},{n:59,t:"playbook",p:4,q:"Scenario: A coach offers 25% now but hints it could grow if you perform. How do you evaluate a promise that isn't in writing?"},{n:60,t:"playbook",p:4,q:"Scenario: Two aid offers look alike until you read the fine print on renewal terms and fees. What do you compare line by line?"},{n:61,t:"spark",p:5,q:"What qualities do you value most in teammates?"},{n:62,t:"spark",p:5,q:"What kind of coach brings out your best?"},{n:63,t:"spark",p:5,q:"How important is team culture to your experience?"},{n:64,t:"spark",p:5,q:"What does accountability mean to you?"},{n:65,t:"spark",p:5,q:"What team values matter most to you?"},{n:66,t:"mirror",p:5,q:"What type of teammate are you?"},{n:67,t:"mirror",p:5,q:"How do you handle competition within your own team?"},{n:68,t:"mirror",p:5,q:"What kind of culture helps you thrive?"},{n:69,t:"mirror",p:5,q:"What would be a dealbreaker in a team environment?"},{n:70,t:"mirror",p:5,q:"How important is feeling connected to your teammates?"},{n:71,t:"playbook",p:5,q:"Scenario: You love the coach and facilities, but players describe the culture as toxic. What do you do?"},{n:72,t:"playbook",p:5,q:"Scenario: The team wins often, but the players seem unhappy. How much would that matter to you?"},{n:73,t:"playbook",p:5,q:"Scenario: You connect with the team but have concerns about the coaching staff. How do you evaluate it?"},{n:74,t:"playbook",p:5,q:"Scenario: On your visit the seniors seem checked out and the freshmen do all the talking. What does that tell you, and what do you ask players privately?"},{n:75,t:"playbook",p:5,q:"Scenario: A coach runs an intense, old-school program some athletes love and others quietly resent. How do you figure out which type you'd be?"},{n:76,t:"capstone",p:6,q:"What are your top five non-negotiables in a college experience?"},{n:77,t:"capstone",p:6,q:"What does your ideal college fit actually look like?"},{n:78,t:"capstone",p:6,q:"What are you unwilling to compromise on?"},{n:79,t:"capstone",p:6,q:"Imagine graduation day. What would make you say, I chose the right school?"},{n:80,t:"capstone",p:6,q:"If you had to decide today, what would matter most?"},{n:81,t:"capstone",p:6,q:"If your sport ended tomorrow, would you still choose that school?"}];var Qt=[{n:1,p:1,title:"Define Your Target List",body:"Write down 15-20 schools that fit you athletically, academically, and financially. Split them into Reach, Match, and Safety.",win:"A written list of 15+ schools, sorted into three tiers."},{n:2,p:1,title:"Know Your Numbers",body:"Record your current GPA, test scores, and key athletic stats for your position. These are the numbers coaches ask for first.",win:"A single sheet with your academic and athletic metrics."},{n:3,p:1,title:"Build Your Athletic Resume",body:"Create a one-page resume: positions, stats, height/weight, club team, coach contact, GPA, and graduation year.",win:"A clean one-page PDF resume ready to send."},{n:4,p:1,title:"Capture Highlight Footage",body:"Film or gather 3-5 full games or events. Raw footage now becomes your highlight reel later \u2014 you can't recruit without it.",win:"At least 3 games of usable raw footage saved."},{n:5,p:1,title:"Create Your Highlight Reel",body:"Cut a 3-4 minute reel: best plays first, jersey clearly visible, your number noted in the intro. No music tricks \u2014 coaches want film.",win:"A shareable highlight link (Hudl, YouTube unlisted)."},{n:6,p:1,title:"Set Up Your Recruiting Email",body:"Make a clean, professional email address with your name and grad year. Use it only for recruiting.",win:"A dedicated, professional recruiting inbox created."},{n:7,p:1,title:"Register With Eligibility Centers",body:"Start your NCAA Eligibility Center and/or NAIA registration. Doing this early prevents senior-year panic.",win:"Eligibility account created and profile started."},{n:8,p:1,title:"Audit Your Social Media",body:"Read every public post as a coach would. Delete anything you wouldn't want a coach or admissions officer to see.",win:"Clean public profiles across every platform."},{n:9,p:1,title:"Research Academic Fit",body:"For your top 10 schools, note the majors offered, average admitted GPA, and graduation rate for athletes.",win:"Academic notes on your top 10 schools."},{n:10,p:1,title:"Talk Money Early",body:"Sit down with your family and define your real budget. Learn the difference between athletic aid, academic aid, and need-based aid.",win:"A clear family budget number and aid game plan."},{n:11,p:1,title:"Map the Recruiting Calendar",body:"Find the contact, evaluation, and dead periods for your sport and division. Know when coaches can legally respond.",win:"Key recruiting dates added to your calendar."},{n:12,p:1,title:"Get a Coach Reference Ready",body:"Ask your current coach if they'll vouch for you. Confirm the contact info college coaches will use to reach them.",win:"A coach who has agreed to be your reference."},{n:13,p:1,title:"Phase 1 Self-Check",body:"Review weeks 1-12. Is your list, resume, film, and eligibility in place? Fix any gaps before you start reaching out.",win:"Every foundation piece complete and verified."},{n:14,p:2,title:"Draft Your Intro Email",body:"Write a personalized template: who you are, your numbers, your reel link, and why THIS school. Leave blanks to customize per coach.",win:"A reusable, personalized intro email template."},{n:15,p:2,title:"Find the Right Coach Contacts",body:"For your top 10, find the exact recruiting coordinator or position coach \u2014 not just the head coach's general inbox.",win:"Verified names and emails for 10 programs."},{n:16,p:2,title:"Send Your First 5 Emails",body:"Email five target coaches. Customize the school-specific line in each. Attach nothing heavy \u2014 link your reel instead.",win:"Five personalized emails sent and logged."},{n:17,p:2,title:"Start a Tracking Sheet",body:"Build a spreadsheet: school, coach, date contacted, response, next step. Recruiting is a pipeline \u2014 track it like one.",win:"A living spreadsheet tracking every contact."},{n:18,p:2,title:"Send the Next 10",body:"Reach out to ten more programs across all three tiers. Volume matters early \u2014 most won't reply, and that's normal.",win:"15+ total programs contacted and tracked."},{n:19,p:2,title:"Follow Up Politely",body:"For coaches who didn't reply in two weeks, send one short, respectful follow-up with an updated stat or result.",win:"Follow-ups sent to all non-responders."},{n:20,p:2,title:"Fill Out Recruiting Questionnaires",body:"Complete the online recruit form on each target school's athletics site. It's how many programs enter you into their system.",win:"Questionnaires done for every target school."},{n:21,p:2,title:"Update Your Reel",body:"Add your best recent footage. A fresh clip at the top signals you're active and improving.",win:"An updated reel with recent highlights."},{n:22,p:2,title:"Connect on Recruiting Platforms",body:"Optimize your profile on the platforms coaches actually check for your sport. Complete every field; add your reel.",win:"A fully completed recruiting platform profile."},{n:23,p:2,title:"Attend One Camp or Showcase",body:"Pick an event where your target coaches will actually be. Email them beforehand so they know to watch you.",win:"Registered for an event with target coaches present."},{n:24,p:2,title:"Email Coaches Before the Event",body:"Tell each target coach your jersey number, schedule, and that you'd value their feedback. Make yourself easy to find.",win:"Pre-event emails sent to attending coaches."},{n:25,p:2,title:"Debrief After the Event",body:"Email coaches you met: thank them, restate interest, share how it went. The follow-up matters more than the event.",win:"Post-event thank-you emails sent within 48 hours."},{n:26,p:2,title:"Phase 2 Self-Check",body:"Review your tracking sheet. How many real conversations are open? Double down on programs showing genuine interest.",win:"A short list of programs actively engaging you."},{n:27,p:3,title:"Identify Your Warm Leads",body:"Separate coaches who replied and engaged from cold contacts. Your energy now goes to the warm ones.",win:"A ranked list of genuinely interested programs."},{n:28,p:3,title:"Schedule a Coach Call",body:"Ask a warm coach for a phone call. Prepare 5 questions about role, development, academics, and timeline.",win:"At least one coach call scheduled."},{n:29,p:3,title:"Nail the Phone Call",body:"Be on time, upbeat, and curious. Ask your questions, take notes, and end by asking what the next step is.",win:"A completed call with clear next steps noted."},{n:30,p:3,title:"Plan an Unofficial Visit",body:"Set up a campus visit on your own. Tour academics and athletics, and try to meet the coaching staff.",win:"One unofficial visit on the calendar."},{n:31,p:3,title:"Prepare Visit Questions",body:"Write questions for players and staff: playing time, culture, academic support, what a normal day looks like.",win:"A visit question list for players and coaches."},{n:32,p:3,title:"Talk to Current Players",body:"On any visit or call, ask players what they'd change about the program. Their honesty reveals the real culture.",win:"Candid feedback from at least two current players."},{n:33,p:3,title:"Compare Your Options Side by Side",body:"Score each serious school on athletics, academics, cost, location, and culture. Make the tradeoffs visible.",win:"A scored comparison of your top programs."},{n:34,p:3,title:"Keep Coaches Updated",body:"Send warm-lead coaches a brief update: a new result, grade, or test score. Stay top of mind without pestering.",win:"Update sent to every actively interested coach."},{n:35,p:3,title:"Protect Your Grades",body:"A drop in GPA can cost an offer. Lock in a strong term \u2014 academics keep your options open and aid higher.",win:"Grades on track or improving this term."},{n:36,p:3,title:"Understand Offer Types",body:"Learn what's real: verbal vs. written, full vs. partial, athletic vs. academic. Know what you're actually being offered.",win:"You can explain the difference between offer types."},{n:37,p:3,title:"Line Up Your References",body:"Confirm your coach and a teacher will speak well of you on short notice. Coaches do call references.",win:"Two references confirmed and ready."},{n:38,p:3,title:"Plan for Official Visits",body:"If invited on official visits, map which to take. You're limited \u2014 spend them on real contenders only.",win:"A prioritized official-visit plan."},{n:39,p:3,title:"Phase 3 Self-Check",body:"Which schools are genuinely recruiting you back? Be honest. Refocus on programs where the interest is mutual.",win:"A short list of mutual-interest programs."},{n:40,p:4,title:"Revisit Your Non-Negotiables",body:"Return to what you can't compromise on. Use it as the filter for every offer and conversation ahead.",win:"Your top 5 non-negotiables written and ranked."},{n:41,p:4,title:"Get Offers in Writing",body:"A verbal isn't binding. Politely ask for terms in writing before you treat any offer as real.",win:"Written terms requested from every offering school."},{n:42,p:4,title:"Read the Fine Print",body:"Compare renewal terms, GPA requirements, and what happens if you're injured. The fine print is the real offer.",win:"Fine print compared across all offers."},{n:43,p:4,title:"Run the Real Cost Numbers",body:"Calculate net cost after aid for each school \u2014 not the sticker price. The cheapest tuition isn't always the best value.",win:"A net-cost figure for every finalist."},{n:44,p:4,title:"Have the Family Decision Talk",body:"Sit down with your family. Separate fit from finances and from pressure. Name what's truly driving the choice.",win:"An honest family conversation completed."},{n:45,p:4,title:"Take Your Official Visits",body:"On each visit, picture a normal Tuesday \u2014 not just game day. Talk to players away from the staff.",win:"Official visits taken to real contenders."},{n:46,p:4,title:"Trust the Gut Check",body:"After visits, ask: where can you see yourself if your sport ended tomorrow? That answer matters.",win:"A clear gut read on each finalist."},{n:47,p:4,title:"Narrow to Your Top 3",body:"Cut the list to three. Anything beyond three is usually emotion, not real options.",win:"A committed top-three shortlist."},{n:48,p:4,title:"Ask the Hard Questions",body:"Before deciding, ask each finalist coach the questions you've been afraid to ask. Their answers decide it.",win:"Hard questions asked and answered."},{n:49,p:4,title:"Make the Decision",body:"Choose. Weigh fit over hype, value over sticker price, and the place you'd thrive over the name that impresses others.",win:"A confident, reasoned commitment decision."},{n:50,p:4,title:"Notify the Other Coaches",body:"Tell the programs you're declining \u2014 directly and gratefully. The recruiting world is small; class matters.",win:"Respectful declines sent to other coaches."},{n:51,p:4,title:"Lock In Eligibility & Paperwork",body:"Finalize your eligibility center, transcripts, and any signing paperwork. Don't let admin undo your hard work.",win:"All eligibility and signing paperwork complete."},{n:52,p:4,title:"Celebrate & Reset Goals",body:"You earned this. Celebrate \u2014 then set your goals for arriving ready: academically, athletically, and mentally.",win:"Commitment celebrated; arrival goals written."}];var zn="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKUAAAC2CAYAAAC4aU3vAABM4klEQVR42u29d5wdZ3U3/j3PtDtz2xatepesZsmy5S4XGdu40EwnhBJqEpJfeAMkkOTN7yUkbyAEiAmBhIRQDAYHjAEbjI273KtkVatLq7bS7mrb7XdmnvP+8czMvbt7d7W7Wkm7q53PZ1Xu3jbPfOd7zvme85xDGN8HVX7WkXpovQQgT/bCpqYViazMpIRmNJKU9RCiEVI2gVDHTI0gbiBQEuAkgxIEdpjJAdgkwARBMCM24BcjFMGQDJRB5BI4x6A8ATkAPQzOgKmTiE+A0QkS7WDZzkJ0St89kRDJnra27dkhrIEA1ong3BlA9c+4vajj6bsKBb71CIA3EPhEYsaSBva9GcxypmDMZaK5YJ5FoFkgTAF4CoNSBI4DZIAIVHM5uP/V5X7/GHhpqdajVPtTmAGwy6AcgXsAOgFGGwNHQXyEGAclaQeJ+Ahpeku2ZVfHYGsQrFcIVjlegErjAIAMwK/5rBkznKQbm+2DFhGwBEIuJYnFTDQH4JkEShGJ3mfJVUDjfgiTQ1ijkawZn+T/IYgqSKYqAPf5/swSrEDbQuBDDNoDpp0C2AWWezNm6RBaWvIDfBetal3HJFDHCihFxQTXNr9O07zpAtpiAKuY5SoQrSBgEYDpRELvzzrRtZcAy6rTparzpjF4c3Kffwc/4cMUMKDyEfqyO7P0AbQwsA+M7UTYAuatknhXvq352MDmPzL98lwFZTUI/b53azo9r05aWCZZXAzGJURYzeBFRCJVfREqJq8X8Ki3rzlhj2rAci/A9gErg8Esewi0lxlbQHhJQGwQZfe17u6Dnf3fep1+NkFKOPPmuB8IY/WL5hjCv0gKcTmBLwdjFQRNrSwsgzmiPl/9dWbAR4OsFA3DXlc/yGcJrESVpWIwWHIbEbYy0wsk5POeKzYWO/cd7H+a67Qzae7pNLOhqACpctgNs2dppF0KoV0D8FXMWCmEiIPCpWSoBWU/+IpitMBH1W4a9X/DEPrRNwh/wFX/Dk1l7StE4S1T9W8KPpAIENT/9wN9h/BzRhGsMripNYCIKFgEBljKPAjbATwDEk/4Hr1c6NhzuL9PCjpJoDmmQBn6J73YsKmpKVHg+MVMdD2A6wi4iEgk+7Cgr5afqLfTP3LQVV9sZkAyICXgS4YvAclKs6lGlhCAJghCAIZGMDSCrgF61b8NXXG4qVcuaK8vwEDZU8GU66nPKnsMz2d4Uj3m+epxXzKk7P16QYAggiYAIYK/qf/59AXvCIEqq9Zdqzb9LGWWQa+C+HFI+VgMsVdOnNiZqcGiowpQGkUger1M8vT584SPdQJ0C4CrQTSHiKLo8
